<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kable - High-Performance Reactive Hardware Communication Engine</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="High-Performance, Zero-Allocation Reactive Hardware Communication Engine for .NET combining Microsoft Bedrock Pipelines and RSocket interaction patterns.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme: Docsify Themeable (Modern & Clean Dark/Light) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  
  <style>
    :root {
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --theme-color: #2563eb;
      --sidebar-width: 280px;
      --content-max-width: 960px;
      --code-font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace;
      --code-font-size: 0.9em;
      --sidebar-nav-link-color--active: #2563eb;
      --sidebar-nav-link-font-weight--active: 600;
    }
    
    .markdown-section code {
      border-radius: 4px;
      padding: 2px 6px;
    }
    
    .sidebar-nav strong {
      color: #1e293b;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .app-name-link {
      font-weight: 700;
      font-size: 1.25rem;
    }
    
    .badge {
      display: inline-block;
      padding: 0.25em 0.5em;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 0.25rem;
      background: #eff6ff;
      color: #1d4ed8;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="app">Loading Kable Documentation...</div>
  
  <script>
    window.$docsify = {
      name: '🔌 Kable',
      repo: 'https://github.com/Johnny-HW/Kable',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'en/README.md',
      fallback: true,
      nameLink: {
        '/ko/': '#/ko/',
        '/zh-tw/': '#/zh-tw/',
        '/ja/': '#/ja/',
        '/de/': '#/de/',
        '/zh-cn/': '#/zh-cn/',
        '/es/': '#/es/',
        '/': '#/en/'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/ko/': '문서 검색...',
          '/zh-tw/': '搜尋文件...',
          '/ja/': 'ドキュメントを検索...',
          '/de/': 'Dokumentation durchsuchen...',
          '/zh-cn/': '搜索文档...',
          '/es/': 'Buscar en la documentación...',
          '/': 'Search documentation...'
        },
        noData: {
          '/ko/': '검색 결과가 없습니다',
          '/zh-tw/': '找不到相關結果',
          '/ja/': '結果が見つかりません',
          '/de/': 'Keine Ergebnisse gefunden',
          '/zh-cn/': '未找到结果',
          '/es/': 'No se encontraron resultados',
          '/': 'No results found'
        },
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      }
    }
  </script>
  
  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Search Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Copy Code Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Prism Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>

  <!-- Mermaid Support -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true, theme: 'default' });
    window.mermaid = mermaid;
  </script>
  <script src="https://unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
