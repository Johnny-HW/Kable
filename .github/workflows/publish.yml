name: Publish Kable to NuGet

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/pages.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore Kable.sln

      - name: Run Unit Tests
        run: dotnet test Kable.sln --configuration Release --no-restore -m:1 --verbosity normal

      - name: Verify Concurrent Start Failure Propagation
        shell: pwsh
        run: ./tests/Kable.Tests/Cases/Engine/Lifecycle/VerifyConcurrentStart.ps1

      - name: Pack NuGet Packages
        id: candidate
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./tools/release/VerifyPackages.ps1

      - name: Verify documented samples before publication
        shell: pwsh
        run: |
          dotnet run --project samples/Kable.QuickStart/Kable.QuickStart.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/Kable.Host/Kable.Host.csproj -c Release --no-build -- --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project samples/Kable.ConfigStudio/Kable.ConfigStudio.csproj -c Release --no-build -- --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tools/release/SharedMemorySmoke/SharedMemorySmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: NuGet Login (OIDC Trusted Publisher)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: NuGet/login@v1
        id: login
        with:
          user: eurochael

      - name: Publish to NuGet.org
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && steps.login.outputs.NUGET_API_KEY != ''
        run: |
          Get-ChildItem -LiteralPath '${{ steps.candidate.outputs.feed }}' -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          Get-ChildItem -LiteralPath '${{ steps.candidate.outputs.feed }}' -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }


