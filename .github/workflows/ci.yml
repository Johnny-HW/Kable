name: CI - Build, Test & Packaging Validation

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

jobs:
  test-windows:
    name: Build & Test (Windows - Full Solution)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore Kable.sln

      - name: Build Solution (Release)
        run: dotnet build Kable.sln --configuration Release --no-restore

      - name: Run All Tests (Release)
        run: dotnet test Kable.sln --configuration Release --no-build -m:1 --verbosity normal

      - name: Verify Concurrent Start Failure Propagation
        shell: pwsh
        run: ./tests/Kable.Tests/Cases/Engine/Lifecycle/VerifyConcurrentStart.ps1

      - name: Validate NuGet Packaging
        run: dotnet pack Kable.sln --configuration Release --output ./nupkgs --no-build

      - name: Validate Generator Package in Isolated Consumer
        shell: pwsh
        run: ./tests/Kable.Generators.Tests/Packaging/VerifyPackage.ps1 -SkipBuild

      - name: Run documented QuickStart and advanced configuration
        run: dotnet run --project samples/Kable.QuickStart/Kable.QuickStart.csproj --configuration Release --no-build
